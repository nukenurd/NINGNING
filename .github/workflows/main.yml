on:
push:
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: "3.11"
- name: Install tools
run: pip install platformio esptool==4.8.1
- name: Build all variants
run: pio run
- name: Make single-file flashable images (flash at 0x0)
run: |
mkdir -p out
BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -n1)
for e in cyd_ili9341 cyd_st7789 cyd_ili9341_nopin cyd_st7789_nopin; do
B=.pio/build/$e
python -m esptool --chip esp32 merge_bin -o out/NINGNING_$e.bin \
--flash_mode dio --flash_freq 40m --flash_size 4MB \
0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin \
0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
done
ls -l out
- uses: actions/upload-artifact@v4
with:
name: NINGNING-firmware
path: out/*.bin
