; NING NING - Meshtastic BLE client for the 2.8" CYD (ESP32-2432S028)
; Two build targets - pick the one that matches your screen:
;   cyd_ili9341  : the common single-USB CYD (try this first)
;   cyd_st7789   : the 2-USB-port CYD variant (if first one shows white/garbled screen)

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_upload.flash_size = 4MB
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen
    h2zero/NimBLE-Arduino@^1.4.2
build_flags =
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DCORE_DEBUG_LEVEL=0

[env:cyd_ili9341]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER

[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER
    -DTFT_INVERSION_OFF
